[project]
name = "pynyaa"
version = "3.0.0"
description = "Turn nyaa.si releases into neat Python objects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ravencentric", email = "me@ravencentric.cc" }]
keywords = ["anime", "nyaa", "nyaa.si", "nyaasi", "torrent"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["beautifulsoup4>=4.13.5", "httpx>=0.27.2"]

[project.urls]
Documentation = "https://ravencentric.cc/pynyaa"
Repository = "https://github.com/Ravencentric/pynyaa"

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
]
docs = [
  "mkdocs-autorefs>=1.3.0",
  "mkdocs-material>=9.5.50",
  "mkdocstrings[python]>=0.27.0",
]
lint = [
  "pyrefly>=1.4.0",
  "ruff>=0.17.1",
  "typing-extensions>=4.12.2",
]
test = [
  "coverage[toml]>=7.16.2",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-recording>=0.14.0",
  "tomli>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",  # Only used for type-hints
]

[tool.pyrefly]
preset = "all"
python-platform = "all"
project-includes = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
]

[tool.pyrefly.errors]
# 3.10 doesn't have the @override decorator
missing-override-decorator = false
explicit-any = false
implicit-bool = false
unused-call-result = false

[tool.pytest]
addopts = ["-ra", "--showlocals"]
filterwarnings = ["error"]
log_cli_level = "INFO"
strict = true
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.uv]
exclude-newer = "P2D"
